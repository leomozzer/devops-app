name: '1 - Build NestJS App'
on:
  workflow_dispatch:
    inputs:
      # Define an input for the 'stage'
      stage:
        description: 'Select the deployment stage'
        required: true # Make it required so the user must select one
        default: 'dev' # Set 'dev' as the default option
        type: choice
        options:       # Provide the list of available options
          - dev
          - test
          - prod
  workflow_call:

jobs:
  build_app:
    name: "Build NodeJS App"
    strategy:
      matrix:
        stage: ["${{ inputs.stage }}"]
    runs-on: ubuntu-latest
    environment: ${{ matrix.stage }}
    defaults:
     run:
       shell: bash

    steps:
    - uses: actions/checkout@v3

    - uses: "./.github/actions/created-stage-file"
      with:
        ENVIRONMENT: ${{ inputs.stage }}

    - uses: "./.github/actions/node-build"
      with:
        WORKING_DIR: "./backend"

