name: '1 - Build NestJS App'
on:
  workflow_dispatch:
    inputs:
      # Define an input for the 'stage'
      stage:
        description: 'Select the deployment stage'
        required: true # Make it required so the user must select one
        default: 'dev' # Set 'dev' as the default option
        type: choice
        options:       # Provide the list of available options
          - dev
          - test
          - prod
  # NEW TRIGGER: Trigger on push to the 'dev' branch
  push:
    branches:
      - dev 

jobs:
  build_app:
    name: "Build NodeJS App"
    strategy:
      matrix:
        stage:  # If triggered by workflow_dispatch, use the user's input
        # If triggered by workflow_dispatch, use the user's input
        - ${{ github.event_name == 'workflow_dispatch' && inputs.stage || (github.event_name == 'push' && github.ref_name == 'dev' && 'dev') }}
          # If triggered by a push to 'dev', set stage to 'dev'
          
          # Add more conditions here if you have other push branches for different stages
          # For example, if push to 'main' should imply 'prod':
          # || (github.event_name == 'push' && github.ref_name == 'main' && 'prod')

    runs-on: ubuntu-latest
    environment: ${{ matrix.stage }}
    defaults:
     run:
       shell: bash

    steps:
    - uses: actions/checkout@v3

    - uses: "./.github/actions/created-stage-file"
      with:
        ENVIRONMENT: ${{ matrix.stage }}

    - uses: "./.github/actions/node-build"
      with:
        WORKING_DIR: "./backend"
